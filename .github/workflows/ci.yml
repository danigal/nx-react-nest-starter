name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: true
  NX_DAEMON: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - if: github.event_name == 'pull_request'
        run: pnpm nx format:check --base="$NX_BASE" --head="$NX_HEAD"
      - if: github.event_name != 'pull_request'
        run: pnpm format:check
      - if: github.event_name == 'pull_request'
        run: pnpm nx affected -t lint,typecheck --base="$NX_BASE" --head="$NX_HEAD"
      - if: github.event_name != 'pull_request'
        run: pnpm lint && pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm routes:check
      - run: pnpm migration:check
      - if: github.event_name == 'pull_request'
        run: pnpm nx affected -t test,build --base="$NX_BASE" --head="$NX_HEAD"
      - if: github.event_name != 'pull_request'
        run: pnpm test && pnpm build

  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:api

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm image:smoke
